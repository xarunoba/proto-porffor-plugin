[install]
download_url = "https://github.com/CanadaHonk/porffor/releases/download/alpha-{versionMinor}/{download_name}"

[locate.exes.porf]
exe_path = "porf"
primary = true

[platform.linux]
archs = ["x64", "arm64"]
download_name = "porffor-linux-{arch}{libc}.tar.gz"

[platform.linux.arch]
x86_64 = "x64"
aarch64 = "arm64"

[platform.linux.libc]
gnu = ""
musl = "-musl"

[platform.macos]
archs = ["x64", "arm64"]
download_name = "porffor-darwin-{arch}.tar.gz"

[platform.macos.arch]
x86_64 = "x64"
aarch64 = "arm64"
